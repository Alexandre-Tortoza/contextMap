# Busca de pessoas, fundida no mapa: uma 2ª ContextRun por bloco na mesma branch, com SAM3
# text_prompt no lugar do SAM2 (evidência direta: person, human body, face, hand; indício: backpack,
# helmet, shoe, glove). Rotula o mesmo intérprete do perfil SOTA (Qwen 8B, 8 maiores regiões);
# a frase do SAM3 fica na proveniência da região. Sem PTv3 nesta run.
schema_version = "0.1.0"

[pipeline.stages]
point_representation = false

[resources.providers]
"visual_perception.region_discovery" = "ablation_providers:load_sam3"

[components.region_perception.discovery]
backend = "sam3"

[components.region_perception.discovery.sam3]
checkpoint = "facebook/sam3"
model_version = "3c879f39826c281e95690f02c7821c4de09afae7"
device = "cuda"
precision = "bfloat16"
strategy = "text_prompt"
score_threshold = 0.5
mask_threshold = 0.5
prompts = ["person", "human body", "face", "hand", "backpack", "helmet", "shoe", "glove"]

[components.region_perception.discovery.sam3.normalization_config]
minimum_valid_fraction = 0.5
maximum_exclusion_fraction = 0.0
