# Intérprete Florence-2 <REGION_TO_CATEGORY> sobre o recorte justo da caixa (única view aceita para
# uma região só com caixa): uma chamada barata por região, label = texto da task, sem score.
schema_version = "0.1.0"

[resources.providers]
"visual_perception.semantic_interpretation" = "ablation_providers:load_florence2_semantic"

[components.semantic_interpretation.interpreter]
backend = "florence2"

[components.semantic_interpretation.interpreter.florence2]
checkpoint = "florence-community/Florence-2-large"
revision = "4271c66b88cdbc05735372ec13b2360108de5317"
task = "<REGION_TO_CATEGORY>"
supported_modes = ["region"]
device = "cuda"
precision = "float16"
max_new_tokens = 64
temperature = 0.0
view_policy = { region_views = ["tight_crop"] }
